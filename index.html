<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,initial-scale=1.0">

    <title>Gender Reveal</title>

    <meta name="theme-color"
          content="#FFF6D8">

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Zen+Maru+Gothic:wght@400;500;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

</head>

<body>

    <!-- 背景 -->

    <div class="background">

        <div class="sun-glow"></div>

        <div class="cloud cloud1"></div>
        <div class="cloud cloud2"></div>
        <div class="cloud cloud3"></div>

        <div class="sparkles"></div>

    </div>

    <!-- ガーランド -->

    <div class="garland">

        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>

    </div>

    <!-- メイン -->

    <main class="container">

        <p class="welcome">

            Welcome Baby

        </p>

        <p class="sub">

            A little surprise awaits...

        </p>

        <h1>

            赤ちゃんからのお知らせ

        </h1>

        <!-- Balloon -->

        <div id="balloon"
             class="balloon">

            <div class="balloon-body">

                <div class="shine"></div>

                <div class="highlight"></div>

                <div class="glitter g1"></div>
                <div class="glitter g2"></div>
                <div class="glitter g3"></div>

            </div>

            <div class="knot"></div>

            <div class="string"></div>

        </div>

        <p class="tap">

            Tap to Reveal ♡

        </p>

    </main>

    <!-- Reveal -->

    <section
        id="reveal"
        class="reveal hidden">

        <div class="reveal-card">

            <div class="heart">

                🎀

            </div>

            <h2>

                It's a Girl!

            </h2>

            <p class="message">

                Congratulations!

                <br><br>

                Our little princess
                is on the way.

            </p>

            <p class="thanks">

                Thank you for celebrating
                with us ♡

            </p>

        </div>

    </section>

    <script src="script.js"></script>

</body>

</html>
