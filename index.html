<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gender Reveal 💗</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

</head>

<body>

    <!-- Background -->

    <div class="background">

        <div class="cloud cloud1"></div>
        <div class="cloud cloud2"></div>
        <div class="cloud cloud3"></div>

        <div class="sparkles"></div>

    </div>

    <!-- Garland -->

    <div class="garland">

        <span class="flag"></span>
        <span class="flag"></span>
        <span class="flag"></span>
        <span class="flag"></span>
        <span class="flag"></span>
        <span class="flag"></span>
        <span class="flag"></span>
        <span class="flag"></span>

    </div>

    <!-- Main -->

    <main id="main" class="container">

        <p class="small-title">
            Baby Announcement
        </p>

        <h1 class="welcome">
            Welcome Baby
        </h1>

        <p class="description">
            A little surprise awaits... ♡
        </p>

        <!-- Balloon -->

        <div id="balloon" class="balloon">

            <img
                src="balloon.svg"
                alt="Gender Reveal Balloon"
                class="balloon-svg">

        </div>

        <p class="tap">
            Tap the Balloon 🎈
        </p>

    </main>

    <!-- Reveal -->

    <section id="reveal" class="reveal hidden">

        <div class="reveal-card">

            <div class="emoji">
                👶💗
            </div>

            <h2>
                It's a Girl!
            </h2>

            <p class="message">

                Our little princess<br>
                is on the way.

                <br><br>

                We can't wait to meet her.

            </p>

            <div class="heart-line">
                🤍🤍🤍
            </div>

            <p class="thanks">

                Thank you for celebrating
                this special moment with us.

            </p>

        </div>

    </section>

    <!-- Footer -->

    <footer>

        Made with love 🤍

    </footer>

    <!-- JS -->

    <script src="script.js"></script>

</body>

</html>
