<?xml version="1.0" encoding="UTF-8"?>
<svg width="260" height="360" viewBox="0 0 260 360"
xmlns="http://www.w3.org/2000/svg">

<defs>

<linearGradient id="balloonGradient"
x1="15%" y1="5%"
x2="85%" y2="100%">

<stop offset="0%" stop-color="#F1E8FF"/>

<stop offset="30%" stop-color="#DEC8FF"/>

<stop offset="60%" stop-color="#BE9AF2"/>

<stop offset="100%" stop-color="#8D68CF"/>

</linearGradient>

<radialGradient id="shine">

<stop offset="0%" stop-color="white" stop-opacity=".95"/>

<stop offset="100%" stop-color="white" stop-opacity="0"/>

</radialGradient>

<filter id="shadow"
x="-40%"
y="-40%"
width="180%"
height="180%">

<feDropShadow

dx="0"

dy="14"

stdDeviation="12"

flood-color="#8366C7"

flood-opacity=".25"/>

</filter>

</defs>

<!-- Balloon -->

<path

filter="url(#shadow)"

fill="url(#balloonGradient)"

d="

M130 20

C72 20 38 70 38 132

C38 215 87 260 130 305

C173 260 222 215 222 132

C222 70 188 20 130 20

Z

"/>

<!-- Large Shine -->

<ellipse

cx="88"

cy="95"

rx="22"

ry="82"

fill="url(#shine)"

transform="rotate(-18 88 95)"

opacity=".82"

/>

<!-- Reflection -->

<ellipse

cx="108"

cy="72"

rx="10"

ry="10"

fill="white"

opacity=".9"

/>

<ellipse

cx="160"

cy="108"

rx="5"

ry="5"

fill="white"

opacity=".55"

/>

<ellipse

cx="150"

cy="175"

rx="4"

ry="4"

fill="white"

opacity=".45"

/>

<ellipse

cx="96"

cy="188"

rx="5"

ry="5"

fill="white"

opacity=".55"

/>

<!-- Knot -->

<polygon

points="120,304 140,304 130,322"

fill="#8D68CF"

/>

<!-- Ribbon -->

<path

d="

M120 311

C100 307 95 327 108 336

C117 328 120 320 120 311

"

fill="#D8C5FF"

/>

<path

d="

M140 311

C160 307 165 327 152 336

C143 328 140 320 140 311

"

fill="#D8C5FF"

/>

<!-- String -->

<path

d="

M130 322

C126 338 136 348 130 360

"

stroke="#C9B08A"

stroke-width="2.2"

stroke-linecap="round"

fill="none"/>

</svg>
