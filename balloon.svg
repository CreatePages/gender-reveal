<?xml version="1.0" encoding="UTF-8"?>
<svg width="260" height="360" viewBox="0 0 260 360" xmlns="http://www.w3.org/2000/svg">

<defs>

<linearGradient id="balloon" x1="20%" y1="10%" x2="80%" y2="100%">
<stop offset="0%" stop-color="#EEE2FF"/>
<stop offset="35%" stop-color="#D9C3FF"/>
<stop offset="70%" stop-color="#B792F2"/>
<stop offset="100%" stop-color="#8E67CF"/>
</linearGradient>

<radialGradient id="light">

<stop offset="0%" stop-color="white" stop-opacity=".95"/>
<stop offset="100%" stop-color="white" stop-opacity="0"/>

</radialGradient>

<filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
<feDropShadow dx="0"
dy="16"
stdDeviation="14"
flood-color="#7A63C8"
flood-opacity=".28"/>
</filter>

</defs>

<!-- Balloon -->

<path

filter="url(#shadow)"

fill="url(#balloon)"

d="

M130 22

C73 22 38 72 38 132

C38 215 88 255 130 305

C172 255 222 215 222 132

C222 72 187 22 130 22

Z

"/>

