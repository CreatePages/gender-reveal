<?xml version="1.0" encoding="UTF-8"?>
<svg width="240" height="330" viewBox="0 0 240 330" xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- Balloon -->
    <linearGradient id="balloonGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E9DCFF"/>
      <stop offset="40%" stop-color="#D2BCFF"/>
      <stop offset="70%" stop-color="#B58DEB"/>
      <stop offset="100%" stop-color="#8E68D0"/>
    </linearGradient>

    <!-- Shine -->
    <linearGradient id="shineGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>

    <!-- Shadow -->
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0"
                    dy="12"
                    stdDeviation="10"
                    flood-color="#7B61B8"
                    flood-opacity=".25"/>
    </filter>

  </defs>

  <!-- Balloon -->

  <path
      filter="url(#shadow)"
      fill="url(#balloonGradient)"
      d="

      M120 20

      C65 20 30 65 30 120

      C30 200 85 240 120 270

      C155 240 210 200 210 120

      C210 65 175 20 120 20

      Z

      "/>

  <!-- Shine -->

  <ellipse

      cx="82"

      cy="82"

      rx="18"

      ry="60"

      fill="url(#shineGradient)"

      transform="rotate(-18 82 82)"

      opacity=".85"

  />

  <!-- Highlight -->

  <circle

      cx="104"

      cy="65"

      r="10"

      fill="white"

      opacity=".85"

  />

  <!-- Sparkles -->

  <circle cx="82" cy="165" r="3" fill="white" opacity=".8"/>

  <circle cx="155" cy="110" r="2.5" fill="white" opacity=".7"/>

  <circle cx="145" cy="180" r="2" fill="white" opacity=".7"/>

  <circle cx="105" cy="145" r="2" fill="white" opacity=".6"/>

  <!-- Knot -->

  <polygon

      points="112,272 128,272 120,288"

      fill="#9874D9"

  />

  <!-- Ribbon -->

  <path

      d="M112 280
         C96 278 92 294 102 300
         C108 295 112 289 112 280Z"

      fill="#D6C0FF"

  />

  <path

      d="M128 280
         C144 278 148 294 138 300
         C132 295 128 289 128 280Z"

      fill="#D6C0FF"

  />

  <!-- String -->

  <path

      d="M120 288
         C118 315 122 320 120 330"

      stroke="#D9C9A6"

      stroke-width="2"

      fill="none"

      stroke-linecap="round"

  />

</svg>
